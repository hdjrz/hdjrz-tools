name: Deploy Cloudflare Worker CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker to Cloudflare
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Secrets & Prepare Configuration
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_ID: ${{ secrets.CLOUDFLARE_KV_ID }}
        run: |
          if [ -z "$API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing! Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing! Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$KV_ID" ]; then
            echo "::error::CLOUDFLARE_KV_ID secret is missing! Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Auto-sync latestVersion in worker services with package.json (anchored so admin/agent versions are preserved)
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Packaging release version: $PKG_VERSION"
          sed -i "s/^\(\s*latestVersion:\s*\"\)[^\"]*\"/\1$PKG_VERSION\"/g" backend/services/systemService.js
          if [ -f "license/worker.js" ]; then
            sed -i "s/^\(\s*latestVersion:\s*\"\)[^\"]*\"/\1$PKG_VERSION\"/g" license/worker.js
          fi

          # Replace placeholder with actual KV Namespace ID and append account_id
          sed -i "s/LICENSES_ID_PLACEHOLDER/$KV_ID/g" wrangler.toml
          echo "account_id = \"$ACCOUNT_ID\"" >> wrangler.toml

          echo "✅ D1 database bound to worker as 'env.DB' (ID: 2694104f-b9f7-4b99-81db-b5c27a5a2040)."
          echo "✅ Configuration prepared successfully for v$PKG_VERSION."

      - name: Apply Cloudflare D1 Database Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Applying schema.sql to Cloudflare D1 database 'hdjrz-support'..."
          npx --yes wrangler d1 execute hdjrz-support --remote --file=backend/db/schema.sql || true

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler deploy --keep-vars

      - name: Print Wrangler Logs on Failure
        if: failure()
        run: |
          cat ~/.config/.wrangler/logs/*.log || true
