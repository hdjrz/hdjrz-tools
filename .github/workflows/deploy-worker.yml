name: Deploy Cloudflare Worker CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker to Cloudflare
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Secrets & Prepare Configuration
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_ID: ${{ secrets.CLOUDFLARE_KV_ID }}
        run: |
          if [ -z "$API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is missing! Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID secret is missing! Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$KV_ID" ]; then
            echo "::error::CLOUDFLARE_KV_ID secret is missing! Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Auto-sync latestVersion in worker services with package.json (anchored so admin/agent versions are preserved)
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Packaging release version: $PKG_VERSION"
          sed -i "s/^\(\s*latestVersion:\s*\"\)[^\"]*\"/\1$PKG_VERSION\"/g" backend/services/systemService.js
          if [ -f "license/worker.js" ]; then
            sed -i "s/^\(\s*latestVersion:\s*\"\)[^\"]*\"/\1$PKG_VERSION\"/g" license/worker.js
          fi

          # Replace placeholder with actual KV Namespace ID and append account_id
          sed -i "s/LICENSES_ID_PLACEHOLDER/$KV_ID/g" wrangler.toml
          echo "account_id = \"$ACCOUNT_ID\"" >> wrangler.toml

          # Query or auto-create Cloudflare D1 database for zero-lag chat
          echo "Checking Cloudflare D1 database 'hdjrz-support'..."
          D1_LIST_RESP=$(curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/d1/database" \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json")

          D1_ID=$(echo "$D1_LIST_RESP" | jq -r '.result[]? | select(.name=="hdjrz-support") | .uuid' | head -n 1)

          if [ -z "$D1_ID" ] || [ "$D1_ID" = "null" ]; then
            echo "D1 database 'hdjrz-support' not found. Auto-creating D1 database..."
            CREATE_D1_RESP=$(curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/d1/database" \
              -H "Authorization: Bearer $API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"name":"hdjrz-support"}')
            D1_ID=$(echo "$CREATE_D1_RESP" | jq -r '.result.uuid // empty')
            if [ -n "$D1_ID" ]; then
              echo "✅ Created Cloudflare D1 database: $D1_ID"
            else
              echo "⚠️ Could not auto-create D1 database. Response: $CREATE_D1_RESP"
            fi
          else
            echo "✅ Found existing Cloudflare D1 database: $D1_ID"
          fi

          if [ -n "$D1_ID" ] && [ "$D1_ID" != "null" ]; then
            sed -i "s/D1_ID_PLACEHOLDER/$D1_ID/g" wrangler.toml
            echo "✅ D1 database bound to worker as 'env.DB'."
          else
            echo "ℹ️ Running in KV-only mode (removing D1 binding placeholder)."
            sed -i '/\[\[d1_databases\]\]/,+3d' wrangler.toml || true
          fi

          echo "✅ Configuration prepared successfully for v$PKG_VERSION."

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler deploy --keep-vars

      - name: Print Wrangler Logs on Failure
        if: failure()
        run: |
          cat ~/.config/.wrangler/logs/*.log || true
