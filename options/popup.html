<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>hdjrzTools</title>
  <style>
    body {
      width: 300px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    .icon {
      width: 32px;
      height: 32px;
      background: transparent;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      background: #064e3b;
      color: #34d399;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      margin-top: 2px;
    }
    .info-row {
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
    }
    .info-row strong {
      color: #f1f5f9;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 9px;
      background: #2563eb;
      color: white;
      text-align: center;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 14px;
      font-size: 13px;
    }
    .btn:hover {
      background: #1d4ed8;
    }
    .tip {
      font-size: 11.5px;
      color: #cbd5e1;
      background: #1e293b;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 12px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">
      <img src="../icons/icon48.png" alt="JET Logo" style="width: 100%; height: 100%; border-radius: 8px; object-fit: cover;">
    </div>
    <div>
      <h2>hdjrzTools</h2>
      <span class="badge">Active & Ready</span>
    </div>
  </div>

  <div class="info-row">
    <span>Agent Name:</span>
    <strong id="popup-agent">—</strong>
  </div>
  <div class="info-row">
    <span>Zoom Target:</span>
    <strong id="popup-zoom">Configured</strong>
  </div>

  <div class="tip">
    💡 The horizontal escalation bar floats on web pages. In backoffice, it reads live player data. On any page, the User ID can be verified or entered directly in the confirmation modal.
  </div>

  <button class="btn" id="btn-toggle-bar" style="background: #334155; margin-top: 14px;">
    Toggle Floating Bar (Show / Hide)
  </button>
  <button class="btn" id="btn-open-options" style="margin-top: 8px;">Settings & Meanings</button>

  <script src="popup.js"></script>
</body>
</html>
